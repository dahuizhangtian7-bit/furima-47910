default: &default
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>

development:
  <<: *default
  adapter: mysql2
  username: root
  password:
  host: 127.0.0.1
  database: furima-47910_development

test:
  <<: *default
  adapter: mysql2
  username: root
  password:
  host: 127.0.0.1
  database: furima-47910_test

production:
  <<: *default
  adapter: mysql2
  database: furima-47910_production
  username: root
  password: <%= ENV['DATABASE_PASSWORD'] %>
  socket: /var/lib/mysql/mysql.sock